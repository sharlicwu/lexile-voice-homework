<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藍思閱讀 · 單字卡語音作業</title>
    <style>
        :root { --primary: #1a73e8; --primary-dark: #0d47a1; --bg: #eef2f6; --card-bg: #ffffff; --text-dark: #1f2937; --text-muted: #6b7280; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; background-color: var(--bg); color: var(--text-dark); margin: 0; padding: 40px 16px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { width: 100%; max-width: 720px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 34px 36px; text-align: center; }
        .badge { display: inline-block; background: #dbeafe; color: #1e40af; font-size: 14px; font-weight: 700; padding: 6px 16px; border-radius: 20px; border: 1px solid #bfdbfe; letter-spacing: 0.5px; }
        h1 { font-size: 26px; color: var(--primary-dark); font-weight: 800; margin: 16px 0 6px; line-height: 1.3; }
        .sub { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; text-align: left; }
        a.card { display: block; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 16px 18px; text-decoration: none; color: var(--text-dark); transition: 0.2s; }
        a.card:hover { border-color: var(--primary); background: #e8f0fe; transform: translateY(-3px); }
        .emoji { font-size: 30px; }
        .name { font-size: 18px; font-weight: 800; color: var(--primary-dark); margin: 6px 0 4px; }
        .meta { font-size: 13px; color: var(--text-muted); }
        .go { font-size: 13px; font-weight: 700; color: var(--primary); margin-top: 8px; }
        .tip { margin-top: 24px; font-size: 13px; color: var(--text-muted); line-height: 1.6; border-top: 1px solid #f3f4f6; padding-top: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <span class="badge">📚 藍思閱讀 · 語音作業</span>
        <h1>單字卡朗讀與雲端自動上傳</h1>
        <div class="sub">請選擇單元開始：聽力練習 🎧 ／ 錄音作業 🎤 ／ 單字測驗 📝</div>

        <div class="grid">
            <a class="card" href="./Jack-o-Lanterns/">
                <div class="emoji">🎃</div>
                <div class="name">Jack-o'-Lanterns</div>
                <div class="meta">Level P · 18 單字 · 萬聖節燈籠南瓜</div>
                <div class="go">進入單元 →</div>
            </a>
            <a class="card" href="./Jack-o-Lanterns/baamboozle.html">
                <div class="emoji">🎮</div>
                <div class="name">Flip &amp; Answer 遊戲</div>
                <div class="meta">Baamboozle 翻牌搶答 · 15 張牌 · 5 隊 × 3 回合</div>
                <div class="go">開始遊戲 →</div>
            </a>
        </div>

        <div class="tip">
            錄音檔與測驗成績會自動上傳到 Google 試算表（<b>藍思初級語音作業</b>／<b>藍思初級單字成績</b>）。<br>
            之後新增的單元會自動出現在這個首頁。
        </div>
    </div>
</body>
</html>
